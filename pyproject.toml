[project]
name = "vibesec"
version = "1.0.0"
description = "Deterministic Application Security Assessment & Reachability Engine for AI-Generated Codebases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aditya Zalte", email = "mysocialmedia456@gmail.com" }
]
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "fpdf2>=2.7.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "packaging>=23.0",
    "pip-audit>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[project.scripts]
vibesec = "vibesec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibesec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
